<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraCompu | Dashboard</title>
    <base href="http://www.2026compra.com/">
    <link rel="stylesheet" href="./src/styles/output.css">
</head>
<body class="page-background min-h-screen text-slate-700">
    <header class="sticky top-0 z-30 flex items-center justify-between border-b border-white/80 bg-white/90 px-4 py-3 shadow-sm backdrop-blur sm:px-6">
        <div class="flex items-center gap-3">
            <button id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false" class="grid h-11 w-11 place-items-center rounded-xl bg-violet-100 text-violet-700 transition hover:bg-violet-200 lg:hidden">
                <span class="flex w-5 flex-col gap-1"><span class="h-0.5 w-full rounded bg-current"></span><span class="h-0.5 w-full rounded bg-current"></span><span class="h-0.5 w-full rounded bg-current"></span></span>
            </button>
            <a href="#" data-view="home" class="flex items-center gap-3">
                <span class="grid h-10 w-10 place-items-center rounded-2xl bg-[#c8f7dc] font-black shadow-sm">PC</span>
                <span><span class="block font-black tracking-wide text-slate-800">CompraCompu</span><span class="hidden text-xs font-semibold uppercase tracking-[0.15em] text-violet-500 sm:block">Venta y compra</span></span>
            </a>
        </div>
        <nav class="hidden items-center gap-1 rounded-full bg-[#eef6ff] p-1.5 lg:flex">
            <a href="#" data-view="home" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Inicio</a>
            <a href="#" data-view="users" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Usuarios</a>
            <a href="#" data-view="products" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Productos</a>
            <a href="#" data-view="suppliers" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Proveedores</a>
            <a href="#" data-view="orders" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Pedidos</a>
            <a href="#" data-view="clients" class="nav-link rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Clientes</a>
            <a href="#" data-view="employees" class="nav-link employee-nav hidden rounded-full px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Empleados</a>
        </nav>
        <button id="adminButton" type="button" class="rounded-full bg-violet-600 px-4 py-2.5 text-sm font-black text-white shadow-sm transition hover:bg-violet-700">Inicio de sesión</button>
    </header>
    <div id="menuOverlay" class="fixed inset-0 z-30 hidden bg-slate-950/40"></div>
    <aside id="sideMenu" class="fixed inset-y-0 left-0 z-40 w-72 -translate-x-full border-r border-violet-100 bg-white p-5 shadow-2xl transition-transform duration-300 lg:hidden" aria-hidden="true">
        <div class="mb-8 flex items-center justify-between"><div><p class="text-xs font-black uppercase tracking-[0.18em] text-violet-500">Navegación</p><h2 class="mt-1 text-xl font-black text-slate-800">CompraCompu</h2></div><button id="menuClose" type="button" aria-label="Cerrar menú" class="grid h-10 w-10 place-items-center rounded-xl bg-slate-100 text-xl font-bold text-slate-600">×</button></div>
        <nav class="grid gap-2">
            <a href="#" data-view="home" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Inicio</a>
            <a href="#" data-view="users" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Usuarios</a>
            <a href="#" data-view="products" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Productos</a>
            <a href="#" data-view="suppliers" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Proveedores</a>
            <a href="#" data-view="orders" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Pedidos</a>
            <a href="#" data-view="clients" class="nav-link rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Clientes</a>
            <a href="#" data-view="employees" class="nav-link employee-nav hidden rounded-xl px-4 py-3 font-bold text-slate-700 transition hover:bg-violet-50">Empleados</a>
        </nav>
    </aside>
    <main id="app"></main>
    <script type="module" src="./src/main.js?v=20261014-1"></script>
</body>
</html>
