<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraCompu | Dashboard</title>
    <base href="http://www.2026compra.com/"/>
    <link rel="stylesheet" href="./src/styles/output.css">
</head>
<body class="min-h-screen bg-[#f8f7ff] text-slate-700">
    <nav class="sticky top-0 z-20 border-b border-white/80 bg-white/85 shadow-sm backdrop-blur">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between lg:px-8">
            <a href="#" data-view="home" class="flex items-center gap-3">
                <span class="grid h-11 w-11 place-items-center rounded-2xl bg-[#c8f7dc] text-xl shadow-sm">PC</span>
                <span>
                    <span class="block text-lg font-black tracking-wide text-slate-800">CompraCompu</span>
                    <span class="block text-xs font-semibold uppercase tracking-[0.18em] text-[#8b7ed8]">Venta y compra</span>
                </span>
            </a>

            <div class="flex flex-wrap items-center gap-2 rounded-full bg-[#eef6ff] p-2 shadow-inner">
                <a href="#" data-view="home" class="nav-link rounded-full px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Inicio</a>
                <a href="#" data-view="users" class="nav-link rounded-full px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Usuarios</a>
                <a href="#" data-view="products" class="nav-link rounded-full px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Productos</a>
                <a href="#" data-view="orders" class="nav-link rounded-full px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Pedidos</a>
                <a href="#" data-view="clients" class="nav-link rounded-full px-4 py-2 text-sm font-bold text-slate-700 transition hover:bg-white hover:text-[#6d5dd3]">Clientes</a>
            </div>
        </div>
    </nav>
    <main id="app"></main>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
