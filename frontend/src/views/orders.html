<section class="mx-auto max-w-7xl px-5 py-10 lg:px-8">
    <div class="mb-7 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
        <div>
            <p class="flex items-center gap-2 text-sm font-bold uppercase tracking-[0.18em] text-[#bd7d94]">
                <span class="icon-[mdi--clipboard-text-outline] h-5 w-5" aria-hidden="true"></span>
                Ventas
            </p>
            <h1 class="mt-2 text-4xl font-black text-slate-800">Registro de pedidos</h1>
            <p class="mt-2 text-slate-500">Cada línea muestra el producto, su cliente, importe y progreso de entrega.</p>
        </div>
        <label class="flex items-center gap-2 rounded-2xl bg-white px-4 py-3 text-sm font-bold shadow-sm ring-1 ring-[#eef0ff]">
            Estado
            <select id="orderStatusFilter" class="bg-transparent text-slate-600 outline-none">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="proceso">En proceso</option>
                <option value="entrega">En entrega</option>
                <option value="entregado">Entregado</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </label>
    </div>

    <div class="overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-[#eef0ff]">
        <div class="overflow-x-auto">
            <table class="min-w-[1050px] w-full text-left text-sm">
                <thead class="bg-[#f2f0ff] text-xs uppercase tracking-[0.14em] text-slate-500">
                    <tr><th class="px-5 py-4">Pedido</th><th class="px-5 py-4">Fecha</th><th class="px-5 py-4">Cliente</th><th class="px-5 py-4">Producto</th><th class="px-5 py-4">Código</th><th class="px-5 py-4">Cant.</th><th class="px-5 py-4">Precio unit.</th><th class="px-5 py-4">Descuento</th><th class="px-5 py-4">Estado</th></tr>
                </thead>
                <tbody id="orderList" class="divide-y divide-slate-100"></tbody>
            </table>
        </div>
    </div>
</section>
