<section class="mx-auto max-w-7xl px-5 py-10 lg:px-8">
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <p class="flex items-center gap-2 text-sm font-bold uppercase tracking-[0.18em] text-[#8b7ed8]">
                <span class="icon-[mdi--account-group-outline] h-5 w-5" aria-hidden="true"></span>
                Administracion
            </p>
            <h1 class="mt-2 text-4xl font-black text-slate-800">Listado de usuarios</h1>
        </div>
        <button id="newUserButton" class="w-fit rounded-full bg-violet-600 px-5 py-3 text-sm font-black text-white shadow-sm transition hover:bg-violet-700">
            Nuevo usuario
        </button>
    </div>

    <div class="overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-[#eef0ff]">
        <div class="overflow-x-auto">
            <table class="min-w-full text-left text-sm">
                <thead class="bg-[#f2f0ff] text-xs uppercase tracking-[0.14em] text-slate-500">
                    <tr>
                <th class="px-5 py-4 bg-violet-50">ID</th>
                <th class="px-5 py-4">Nombre</th>
                <th class="px-5 py-4">Email</th>
                <th class="px-5 py-4">Estado</th>
                <th class="px-5 py-4">Acciones</th>
                    </tr>
                </thead>
                <tbody id="usersTableList" class="divide-y divide-slate-100">
                    <tr>
                        <td colspan="5" class="px-5 py-4 text-slate-500">Cargando usuarios...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
