<section class="mx-auto max-w-7xl px-5 py-10 lg:px-8">
    <div class="mb-7 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
        <div>
            <p class="flex items-center gap-2 text-sm font-bold uppercase tracking-[0.18em] text-[#5fae7a]">
                <span class="icon-[mdi--package-variant-closed] h-5 w-5" aria-hidden="true"></span>
                Catálogo
            </p>
            <h1 class="mt-2 text-4xl font-black text-slate-800">Productos disponibles</h1>
            <p class="mt-2 text-slate-500">Consulta existencias, precios y códigos de cada equipo o componente.</p>
        </div>
        <label class="relative block w-full max-w-md">
            <span class="icon-[mdi--magnify] absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" aria-hidden="true"></span>
            <input id="productSearch" type="search" placeholder="Buscar por nombre o código" class="w-full rounded-2xl border border-[#e4defd] bg-white py-3 pl-11 pr-4 text-sm outline-none transition focus:border-[#8b7ed8] focus:ring-4 focus:ring-[#eeeaff]">
        </label>
    </div>

    <div id="productSummary" class="mb-5 text-sm font-semibold text-slate-500">Cargando productos...</div>
    <div id="productList" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
</section>
